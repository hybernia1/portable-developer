name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate dependency lock
        shell: powershell
        run: .\scripts\Fetch-Dependencies.ps1 -ValidateCatalogOnly

      - name: Validate release PowerShell compatibility
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -File .\scripts\VerifiedVcRuntimeExtraction.ps1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PortableDeveloper.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format PortableDeveloper.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PortableDeveloper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PortableDeveloper.slnx --configuration Release --no-build --no-restore
