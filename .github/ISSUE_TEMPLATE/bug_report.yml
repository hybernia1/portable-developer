name: Bug report
description: Report a reproducible Portable Developer problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, database contents, private paths, or security vulnerabilities. Report vulnerabilities through GitHub Security Advisories.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.2.1
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: UI language
      options: [English, Czech]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem and reproduction steps
      description: Explain what happened, what you expected, and the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Paste only reviewed, non-sensitive log lines or screenshots.
