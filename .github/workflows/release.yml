name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PortableDeveloper.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format PortableDeveloper.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PortableDeveloper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PortableDeveloper.slnx --configuration Release --no-build --no-restore

      - name: Validate tag version
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          [xml]$project = Get-Content -Raw src/PortableDeveloper.App/PortableDeveloper.App.csproj
          if ([string]$project.Project.PropertyGroup.Version -ne $version) {
            throw "Tag version does not match the application version."
          }
          git merge-base --is-ancestor "${{ github.sha }}" "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "The release tag must point to a commit reachable from origin/main."
          }

      - name: Publish portable application
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\Publish-Online-Windows.ps1 -Version $version -ReleasesToKeep 2

      - name: Upload workflow artifact
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PortableDeveloper-${{ github.ref_name }}-win-x64
          path: |
            artifacts/publish/PortableDeveloper-win-x64-*.zip
            artifacts/publish/PortableDeveloper-win-x64-*.zip.sha256
            artifacts/publish/PortableDeveloper-win-x64-*.spdx.json
          if-no-files-found: error

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/publish/PortableDeveloper-win-x64-*.zip
            artifacts/publish/PortableDeveloper-win-x64-*.spdx.json

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notes = "docs/RELEASE_NOTES_$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes were not found: $notes"
          }
          $archive = (Get-ChildItem artifacts/publish -Filter "PortableDeveloper-win-x64-*.zip" -File -Recurse | Select-Object -First 1).FullName
          $checksum = "$archive.sha256"
          $sbom = [System.IO.Path]::ChangeExtension($archive, ".spdx.json")
          if (-not (Test-Path -LiteralPath $sbom -PathType Leaf)) {
            throw "Release SBOM was not found: $sbom"
          }
          gh release create "${{ github.ref_name }}" $archive $checksum $sbom --verify-tag --title "Portable Developer ${{ github.ref_name }}" --notes-file $notes
