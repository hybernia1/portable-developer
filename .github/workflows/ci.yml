name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate dependency lock
        shell: powershell
        run: .\scripts\Fetch-Dependencies.ps1 -ValidateCatalogOnly

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PortableDeveloper.slnx

      - name: Verify formatting
        run: dotnet format PortableDeveloper.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PortableDeveloper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PortableDeveloper.slnx --configuration Release --no-build --no-restore
